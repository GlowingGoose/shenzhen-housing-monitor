<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>70城住宅价格 · 全景观察</title><link rel="stylesheet" href="style.css?v=2"><script src="app.js?v=2" defer></script></head><body>
<header><a href="./" class="brand">▥ 住宅价格全景 <small>70 CITIES</small></a><a href="70city.csv" download>下载全量数据 ↗</a></header>
<main><div class="intro"><div><p class="eyebrow">国家统计局 / 月度住宅价格指数</p><h1>把70座城市，放在一张图里。</h1><p class="muted">横向比较城市，纵向观察周期；从全国缩小到你关注的城市。</p></div><div class="date"><strong id="latest">—</strong><span>最新数据月份</span></div></div>
<p id="status" role="status">正在读取…</p>
<section class="workspace"><aside><div class="aside-title"><h2>城市筛选</h2><span id="count"></span></div><input id="search" type="search" placeholder="搜索城市" aria-label="搜索城市"><div class="presets"><button data-preset="all">全选</button><button data-preset="none">清空</button><button data-preset="一线">一线</button><button data-preset="二线">二线</button><button data-preset="三线">三线</button><button data-preset="深圳">仅深圳</button></div><p class="hint">可多选；搜索只缩小候选列表。</p><div id="cityList"></div></aside>
<div class="visual"><div class="filters"><label>住宅类型<select id="market"><option value="all">新房 + 二手房</option><option value="新房">新房</option><option value="二手">二手房</option></select></label><label>价格指标<select id="metric"><option value="mom">环比</option><option value="yoy">同比</option></select></label><label>起始月份<select id="start"></select></label><label>结束月份<select id="end"></select></label><label>图表形式<select id="view"><option value="heat">全景热力图</option><option value="line">趋势折线图</option></select></label></div>
<div class="chart-heading"><div><h2 id="chartTitle">全国住宅价格变化</h2><p id="summary" class="muted"></p></div><div id="legend"></div></div><p id="rangeError" role="alert"></p><div id="chart"></div><div id="details" aria-live="polite">点击图中数据，查看数值和官方来源。</div><p class="hint">单位：%；指数减100。红色为上涨，蓝色为下跌；灰色为缺失。热力图色阶随筛选范围统一调整。</p></div></section>
<footer><p id="coverage"></p><p>来源：国家统计局70个大中城市住宅销售价格月报。全市价格指数不等于具体小区成交价；缺月留空，不插值。</p><p id="checked"></p></footer></main></body></html>
